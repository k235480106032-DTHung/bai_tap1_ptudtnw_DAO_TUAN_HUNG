# Cấu hình Website 1
server {
    listen 80;
    server_name site1.hungtuan.id.vn default_server;

    location / {
        root /var/www/site1;
        index index.html index.htm;
    }

    # Cấu hình chuyển hướng API sang Node-RED ở cổng 1880
    location /api/ {
        proxy_pass http://nodered:1880/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}


# Cấu hình Website 2
server {
